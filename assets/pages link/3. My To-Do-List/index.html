<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <link href="styles.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled To-Do List</title>
</head>

<body>
    <div class="main-container">
        <h1> My To-Do-List</h1> 
        <p id="subtitle">Week Days</p>
    
        <ul class="todo-list">

            <!-- List 1 -->
                <li> 
                    <h2>Morning</h2>
                    <ul class="sub-item">
                        <li>
                            <input id="morning" type="checkbox"/>
                            <label for="morning">Praying Soboh</label>
                        </li>
                        
                        <li>
                            <input id="exercise" type="checkbox"/>
                            <label for="exercise">Exercise 30mins</label>
                        </li>
                        
                        <li>
                            <input id="breakfast" type="checkbox"/>
                            <label for="breakfast">Breakfast</label>
                        </li>
                            
                     </ul>
                </li> 
            
                
            
                <!-- List 2 -->
                <li> 
                    <h2>Afternoon</h2>
                    <ul class="sub-item">
                        <li>
                            <input id="lunch" type="checkbox"/>
                            <label for="lunch">Lunch</label>
                        </li>
                        
                        <li>
                            <input id="lohor" type="checkbox"/>
                            <label for="lohor">Praying Lohor</label>
                        </li>
                        
                        <li>
                            <input id="free-time" type="checkbox"/>
                            <label for="free-time">Free Time</label>
                        </li>

                        <li>
                            <input id="free-time" type="checkbox"/>
                            <label for="asr">Praying Asr</label>
                        </li>
                    
                     </ul>
                </li> 
            
                
                
                <!-- List 3 -->
                <li> 
                    <h2>Evening</h2>
                    <ul class="sub-item">
                        <li>
                            <input id="coffee" type="checkbox"/>
                            <label for="coffee">Coffee Time</label>
                        </li>
                        
                        <li>
                            <input id="maghrib" type="checkbox"/>
                            <label for="maghrib">Praying Maghrib</label>
                        </li>
                        
                        <li>
                            <input id="free-time" type="checkbox"/>
                            <label for="free-time">Free Time</label>
                        </li>

                        <li>
                            <input id="praying-aisha" type="checkbox"/>
                            <label for="praying-aisha">Praying Aisha</label>
                        </li>
                    
                     </ul>
                </li> 

                
        
                <!-- List 4-->
                <li> 
                    <h2>Midnight</h2>
                    <ul class="sub-item">
                        <li>
                            <input id="dinner" type="checkbox"/>
                            <label for="dinner">Dinner</label>
                        </li>
                        
                        <li>
                            <input id="graalonline-era" type="checkbox"/>
                            <label for="graalonline-era">GraalOnline Era</label>
                        </li>
                        
                        <li>
                            <input id="night-study" type="checkbox"/>
                            <label for="night-study">Night Study</label>
                        </li>

                        <li>
                            <input id="manhwa" type="checkbox"/>
                            <label for="manhwa">Manhwa</label>
                        </li>
                    
                     </ul>
                </li> 

               
        </ul>
    </div>
</body>

</html>
